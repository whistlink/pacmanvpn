# fly.toml — Fly.io app config for FlyVPN proxy
# Run: fly launch (then fly deploy after each change)

app = "my-flyvpn"          # change this to your chosen app name
primary_region = "jnb"     # Johannesburg — closest to Nairobi; options: ams, lhr, sin, syd

[build]

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = true   # machines sleep when idle (saves free quota)
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
